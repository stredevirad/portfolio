<!doctype html>
<html lang="en" data-theme="dark" data-motion="full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--app-head-->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#efebe3" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <link rel="preload" href="%BASE_URL%fonts/bricolage-grotesque-wght.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%BASE_URL%fonts/instrument-sans-wght.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      /* Applies stored preferences before first paint (no flash). Keys: jhj:theme|motion|recruiter. */
      (function () {
        var d = document.documentElement, base = '%BASE_URL%';
        function get(k) { try { return window.localStorage.getItem('jhj:' + k); } catch (e) { return null; } }
        var theme = get('theme');
        if (theme !== 'light' && theme !== 'dark') theme = 'dark';
        d.setAttribute('data-theme', theme);
        var motion = get('motion');
        if (motion !== 'full' && motion !== 'reduced') {
          motion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'reduced' : 'full';
        }
        d.setAttribute('data-motion', motion);
        var recruiter = get('recruiter') === '1';
        if (recruiter) d.setAttribute('data-recruiter', '1');
        var firstVisit = false;
        try { firstVisit = !window.sessionStorage.getItem('jhj:visited'); } catch (e) {}
        var path = location.pathname.replace(/\/+$/, '/');
        var home = path === base || path + '/' === base;
        if (firstVisit && home && motion === 'full' && !recruiter) d.setAttribute('data-preload', '1');
        d.classList.add('js');
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
